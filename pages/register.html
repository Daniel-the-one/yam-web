<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte — Appel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="login-page">

    <div class="ripple-bg" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </div>
        <span class="auth-title">Appel</span>
      </div>

      <p class="auth-subtitle">Créez votre compte pour commencer à passer des appels.</p>

      <div id="form-error" class="form-error" role="alert"></div>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Nom complet</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="phone_number">Numéro de téléphone</label>
          <input type="tel" id="phone_number" name="phone_number" autocomplete="tel" placeholder="+33 6 12 34 56 78" pattern="[\+]?[0-9\s\-]{7,30}" required>
        </div>
        <div class="field">
          <label for="username">Nom d'utilisateur (optionnel)</label>
          <input type="text" id="username" name="username" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="password-confirm">Confirmer le mot de passe</label>
          <input type="password" id="password-confirm" name="password-confirm" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-primary">Créer mon compte</button>
      </form>

      <p class="auth-footer">Déjà un compte ? <a href="login.html">Se connecter</a></p>
    </div>

  </main>

  <script src="../js/auth.js"></script>
</body>
</html>
